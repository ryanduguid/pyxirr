name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  MATURIN_VERSION: 1.15.0

jobs:
  msrv:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: rustup toolchain install 1.88.0 --profile minimal
      - run: cargo +1.88.0 check --locked --lib

  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test no numpy
        run: cargo test --release --features nonumpy
      - name: Install numpy v1
        if: matrix.python != '3.14'
        run: pip install 'numpy>=1,<2' 'pandas>=1,<2'
      - name: Test numpy v1
        if: matrix.python != '3.14'
        run: cargo test --release
      - name: Install numpy v2
        if: matrix.python != '3.8'
        run: pip install 'numpy>=2,<3' 'pandas>=2,<3'
      - name: Test numpy v2
        if: matrix.python != '3.8'
        run: cargo test --release
      - name: Build and check the stable ABI wheel
        run: |
          pip install maturin==${{ env.MATURIN_VERSION }}
          maturin build --release --strip --features extension,abi
          pip install --force-reinstall target/wheels/*.whl
          python tests/check_wheel.py

  linux:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build Wheels
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          manylinux: auto
          args: --release --strip --sdist --interpreter 3.8 3.9 3.10 3.11 3.12 3.13 3.14
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          manylinux: auto
          args: --features extension,abi --release --strip
      - name: Check that the source distribution installed correctly
        run: python3 -m pip install --user target/wheels/pyxirr-*.tar.gz
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: target/wheels

  linux-cross:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: test
    strategy:
      matrix:
        target: [aarch64, armv7, s390x, ppc64le, ppc64]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --strip --interpreter 3.8 3.9 3.10 3.11 3.12 3.13 3.14
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: auto
          args: --features extension,abi --release --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-cross-${{ matrix.target }}
          path: target/wheels

  linux-musl:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: test
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - i686-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-musleabihf
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: --release --strip --interpreter 3.8 3.9 3.10 3.11 3.12 3.13 3.14
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: musllinux_1_2
          args: --features extension,abi --release --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-musl-${{ matrix.target }}
          path: target/wheels

  windows:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # allow-prereleases: true
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --release --strip --interpreter python${{ matrix.python }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          args: --features extension,abi --release --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python }}
          path: target/wheels

  macos:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --release --strip --interpreter 3.8 3.9 3.10 3.11 3.12 3.13 3.14
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.platform.target }}
          args: --features extension,abi --release --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: target/wheels

  wasm-emscripten:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # https://pyodide.org/en/stable/project/changelog.html
        version:
          - python: "3.13"
            emscripten: 4.0.9 # pyodide 0.28.*
            pyodide: '0.28.3 0.29.4'
          - python: "3.14"
            emscripten: 5.0.3 # pyodide 314.*
            pyodide: '314.0.7'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ matrix.version.emscripten }}
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: wasm32-unknown-emscripten
          rust-toolchain: 1.93.0
          args: --release --strip --interpreter python${{ matrix.version.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check the wheels in Pyodide
        env:
          PYODIDE_VERSIONS: ${{ matrix.version.pyodide }}
        run: |
          for version in $PYODIDE_VERSIONS; do
            npm install --no-save --package-lock=false "pyodide@$version"
            node tests/check_wasm.cjs target/wheels/*.whl
          done
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-wasm-emscripten-${{ matrix.version.emscripten }}
          path: target/wheels

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - linux
      - linux-cross
      - linux-musl
      - windows
      - macos
      - wasm-emscripten
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true

      - run: pip install maturin==${{ env.MATURIN_VERSION }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: pyxirr*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PyPI publish
        env:
          MATURIN_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        # wasm excluded because pypi doesn't support wasm wheels yet
        run: find . -name 'pyxirr*' -not -name '*wasm*' | xargs -l maturin upload --skip-existing --username __token__
